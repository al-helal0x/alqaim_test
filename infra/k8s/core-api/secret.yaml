# ⚠️ هذا الملف يحتوي قيماً وهمية (placeholders) فقط لتشغيل الكلستر المحلي/الاختبار.
# لا يُستخدَم كما هو في بيئة إنتاج حقيقية ولا يجب أن يحتوي أي وقت أسراراً فعلية
# داخل Git. للإنتاج: استبدل القيم عبر `kubectl create secret` مباشرة، أو
# سلسلة أدوات إدارة أسرار (Sealed Secrets / External Secrets Operator).
apiVersion: v1
kind: Secret
metadata:
  name: core-api-secrets
  namespace: alqaim
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: alqaim-v2
type: Opaque
stringData:
  ALQAIM_DATABASE_URL: "postgresql+asyncpg://alqaim:CHANGE_ME@postgres:5432/alqaim"
  ALQAIM_REDIS_URL: "redis://redis:6379/0"
  ALQAIM_JWT_SECRET_KEY: "CHANGE_ME_IN_ENV"
