apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: alqaim
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: alqaim-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: alqaim-v2
    spec:
      containers:
        - name: core-api
          # يُبنى محلياً من infra/docker/Dockerfile.core-api (Context = جذر المستودع)
          # مثال: docker build -f infra/docker/Dockerfile.core-api -t alqaim/core-api:local .
          image: alqaim/core-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: core-api-config
            - secretRef:
                name: core-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
