apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  namespace: alqaim
  labels:
    app.kubernetes.io/name: ai-platform
    app.kubernetes.io/part-of: alqaim-v2
type: Opaque
stringData:
  ALQAIM_AI_DATABASE_URL: "postgresql+asyncpg://alqaim_ai:CHANGE_ME@postgres:5432/alqaim_ai"
  ALQAIM_AI_REDIS_URL: "redis://redis:6379/1"
  # فارغ افتراضياً (llm_provider=null لا يستهلكه) — يُملأ فقط عند تفعيل مزوّد سحابي
  ALQAIM_AI_LLM_API_KEY: ""
