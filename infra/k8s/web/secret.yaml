# لا توجد أسرار جانب-خادم فعلية في apps/web حالياً (التوكنات تُخزَّن في
# localStorage على المتصفح — راجع apps/web/src/api-client/auth-storage.ts).
# هذا الـ Secret محجوز فارغاً عمداً ليطابق نمط core-api/ai-platform (توحيد
# القالب عبر الخدمات الثلاث) ويكون جاهزاً فوراً عند إضافة أي سرّ خادم فعلي
# لاحقاً (مثال: مفتاح توقيع جلسة SSR) دون تعديل بنية الـ Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: alqaim
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: alqaim-v2
type: Opaque
stringData: {}
